name: Radar de licitaciones

# Corre solo, varias veces por dia, y guarda en el repo lo que encuentra.
# Horarios en UTC. Argentina es UTC-3 (sin horario de verano).
#   12:00 UTC = 09:00 ART   |   16:00 UTC = 13:00 ART   |   21:00 UTC = 18:00 ART
# Se corre 3 veces para no perder una apertura si un run falla (ver blueprint).

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write          # para poder commitear el CSV actualizado

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Correr el radar
        run: python src/radar.py

      - name: Regenerar el panel
        run: python scripts/build_dashboard.py

      - name: Guardar novedades en el repo
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/radar_sin_verificar.csv data/historico.csv web/dashboard.html docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios en el radar."
          else
            git commit -m "Radar: corrida $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # docs/index.html se sirve como GitHub Pages -> link publico que se
      # actualiza solo en cada push. Pages redeploya automaticamente.
