name: Radar de licitaciones

# Corre solo, varias veces por dia, y guarda en el repo lo que encuentra.
# Horarios en UTC. Argentina es UTC-3 (sin horario de verano).
#   12:00 UTC = 09:00 ART   |   16:00 UTC = 13:00 ART   |   21:00 UTC = 18:00 ART
# Se corre 3 veces para no perder una apertura si un run falla (ver blueprint).

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write          # para poder commitear el CSV actualizado

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Correr el radar
        run: python src/radar.py

      - name: Regenerar el panel
        run: python scripts/build_dashboard.py

      - name: Guardar novedades en el repo
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/radar_sin_verificar.csv data/historico.csv web/dashboard.html docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios en el radar."
          else
            git commit -m "Radar: corrida $(date -u +'%Y-%m-%d %H:%M UTC')"
            # si alguien pusheo mientras corria (backfill, sesion interactiva),
            # reintenta con rebase antes de rendirse.
            bash scripts/pushear.sh
          fi

      # Mail con las licitaciones nuevas que pasan los chequeos (ver
      # scripts/alerta_mail.py). Va DESPUES de guardar el radar: si el envio
      # falla, el paso queda en rojo pero la corrida ya quedo guardada.
      # Sin los secretos ALERTA_* no manda nada (solo lo dice en el log).
      - name: Avisar por mail las licitaciones nuevas
        env:
          ALERTA_SMTP_HOST: ${{ secrets.ALERTA_SMTP_HOST }}
          ALERTA_SMTP_PORT: ${{ secrets.ALERTA_SMTP_PORT }}
          ALERTA_SMTP_USER: ${{ secrets.ALERTA_SMTP_USER }}
          ALERTA_SMTP_PASS: ${{ secrets.ALERTA_SMTP_PASS }}
          ALERTA_PARA: ${{ secrets.ALERTA_PARA }}
        run: |
          python scripts/alerta_mail.py
          if [ -f data/alertas_enviadas.csv ]; then git add data/alertas_enviadas.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Radar: alertas enviadas $(date -u +'%Y-%m-%d %H:%M UTC')"
            bash scripts/pushear.sh
          fi

      # docs/index.html se sirve como GitHub Pages -> link publico que se
      # actualiza solo en cada push. Pages redeploya automaticamente.
